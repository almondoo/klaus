packages:
  - "ui"

allowBuilds:
  '@biomejs/biome': true
  esbuild: true

# npm アカウント乗っ取り型のサプライチェーン攻撃は公開から数日以内に発覚することが多いため、
# 公開後 7 日(10080 分)未満のバージョンは解決対象にしない。急ぎで取り込む必要がある場合は
# 下の minimumReleaseAgeExclude に `<pkg>@<version>` を追加して個別に除外する。
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - lucide-react@1.30.0
  - ws@8.21.3
  - esbuild@0.28.1

# tsup / vitest が推移的に依存する esbuild を脆弱性修正版(GHSA-g7r4-m6w7-qqqr、
# 0.28.1 で修正)に固定する。開発時のみの依存で配布物には含まれないが、audit をクリーンに保つ。
overrides:
  esbuild: 0.28.1
