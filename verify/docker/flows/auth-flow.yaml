name: 認証フロー
env: local
steps:
  - name: login
    request:
      method: POST
      url: "{{baseUrl}}/login"
    capture:
      token: "$.token"
    assert:
      status: 200
      body:
        - path: "$.token"
          exists: true
  - name: get-me
    request:
      method: GET
      url: "{{baseUrl}}/me"
      headers:
        Authorization: "Bearer {{token}}"
    assert:
      status: 200
      body:
        - path: "$.email"
          equals: "{{testEmail}}"
