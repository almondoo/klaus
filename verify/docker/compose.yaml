# npm publish 相当検証用の compose 定義。
# - demo-api: 検証用ダミー API(VERIFICATION.md 2-1 相当)。
# - klaus: .pack/klaus.tgz(pack 済み tarball)を npm install -g したクリーンな Node 22 の
#   常駐コンテナ。検証(run.sh)も手動操作(make exec)も、このコンテナへの
#   docker compose exec で klaus コマンドを実行する。
#
# klaus サービスのビルドコンテキストは ./.pack(git 管理外)を指す。
# このディレクトリは run.sh がその都度、tarball と Dockerfile のコピーだけを置いて作る
# 最小コンテキストであり、リポジトリの node_modules は含まれない。
services:
  demo-api:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22.19-slim
        WORKDIR /app
        COPY demo-server.mjs .
        EXPOSE 3000
        USER node
        CMD ["node", "demo-server.mjs"]
    healthcheck:
      # slim イメージに curl / wget が無いため node 組み込みの http でヘルスチェックする
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get({host:'127.0.0.1',port:3000,path:'/login'},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      - verify

  klaus:
    build:
      context: ./.pack
      dockerfile: Dockerfile
    depends_on:
      demo-api:
        condition: service_healthy
    networks:
      - verify
    # klaus ui 用。ホストのブラウザから http://127.0.0.1:4884/?token=... で開く。
    # コンテナ内の 127.0.0.1 バインドには外から届かないため、コンテナ内では
    # `klaus ui --host 0.0.0.0`(ポートは既定 4884)で起動すること。
    # ホスト側も 127.0.0.1 に限定し、LAN へは公開しない。
    ports:
      - "127.0.0.1:4884:4884"
    # 常駐させるため sleep で待機し、klaus の実行は docker compose exec で行う。
    # 状態(.klaus/history など)は verify-down まで保持される。
    entrypoint: ["sleep", "infinity"]
    # sleep を PID 1 にしない(down 時に SIGTERM で素直に止まるようにする)
    init: true
    working_dir: /work
    volumes:
      - ./flows:/work/flows:ro
      - ./environments:/work/environments:ro

networks:
  verify: {}
