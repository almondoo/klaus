# PR と develop への push で lint / 型チェック / テスト / ビルドを検証する CI。
# ジョブ名 `ci` は main の ruleset (require-pr-and-ci-main) の必須ステータス
# チェック名と一致させている。変更する場合は ruleset 側も更新すること。
#
# fork からの pull_request は read-only トークン + Secrets なしで実行される
# (さらにリポジトリ設定で全外部コントリビューターの実行承認を必須にしている)。
# pull_request_target は checkout と組み合わせると危険なため使用しない。
name: ci

on:
  pull_request:
  push:
    branches:
      - develop

# 既定では何の権限も与えない。必要な権限は各ジョブで最小付与する
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN の git 資格情報を後続ステップに残さない
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          # publish.yml と同じく正確なバージョンに固定する
          version: 11.5.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: Lint / 型チェック
        run: |
          pnpm lint
          pnpm typecheck

      - name: テスト(カバレッジ閾値込み)
        run: |
          pnpm test:coverage
          pnpm --filter @almondoo/klaus-ui test

      - name: フルビルド
        run: pnpm build:all
