# PR と develop への push で lint / 型チェック / テスト / ビルドを検証する CI。
# ジョブ名 `ci` は main の ruleset (require-pr-and-ci-main) の必須ステータス
# チェック名と一致させている。変更する場合は ruleset 側も更新すること。
#
# fork からの pull_request は read-only トークン + Secrets なしで実行される
# (さらにリポジトリ設定で全外部コントリビューターの実行承認を必須にしている)。
# pull_request_target は checkout と組み合わせると危険なため使用しない。
name: ci

on:
  pull_request:
  push:
    branches:
      - develop

# 既定では何の権限も与えない。必要な権限は各ジョブで最小付与する
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 22.19.0 は engines.node の下限(@apidevtools/swagger-parser 13.1 が >=22.19.0 を要求)。
    # 下限と最新で両方検証する。
    # matrix ジョブのチェック名は `test (22.19.0)` のようになるため、必須チェック `ci` は下の集約ジョブが担う。
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "26"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN の git 資格情報を後続ステップに残さない
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # publish.yml と同じく正確なバージョンに固定する
          version: 12.16.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: Lint / 型チェック
        run: |
          pnpm lint
          pnpm typecheck

      - name: テスト(カバレッジ閾値込み)
        run: |
          pnpm test:coverage
          pnpm --filter @almondoo/klaus-ui test

      - name: フルビルド
        run: pnpm build:all

  # ruleset の必須チェック名 `ci` を維持するための集約ジョブ。
  # matrix の全レグが成功した場合のみ成功する(失敗・キャンセル時も always() で必ず実行して落とす)。
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: matrix 全体の結果を確認
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = "success"
