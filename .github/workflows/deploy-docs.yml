# VitePress で構築したドキュメントサイト (docs/) を GitHub Pages へデプロイするワークフロー。
# VitePress 公式のデプロイ手順 (https://vitepress.dev/guide/deploy#github-pages) を
# 本リポジトリの pnpm 運用に合わせて調整している。
name: deploy-docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-docs.yml"
      # 公開する JSON Schema (docs/public/schema/) の源泉。これらの変更時も再デプロイする
      - "src/core/schema.ts"
      - "src/cli/schema.ts"
      - "src/cli/schema-gen.ts"
      - "src/cli/reporters/json.ts"
  # Actions タブから手動実行できるようにする
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のデプロイを中断せず、キューにある分だけ間引く(公式例のとおり)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN の git 資格情報を後続ステップに残さない
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          # 他ワークフローと同じく正確なバージョンに固定する
          version: 11.5.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: VitePress のビルドキャッシュを復元
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      # docs/guide/flow-definition.md 等が参照する JSON Schema (docs/public/schema/*.json) を
      # ドキュメントビルド前に生成する。生成には dist/schema-gen.js (pnpm build の成果物) が必要。
      - name: JSON Schema を生成
        run: |
          pnpm build
          pnpm build:schema:docs

      - name: ドキュメントをビルド
        run: pnpm docs:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
