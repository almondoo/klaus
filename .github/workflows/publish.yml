# v* タグの push で npm へ公開するワークフロー(セキュリティ強化版)。
# 認証は npm Trusted Publishing (OIDC)。トークン・Secrets は一切使わない。
#
# 設計方針:
# - 全 action はコミット SHA でピン留め(タグは後から移動され得るため)。pnpm も正確なバージョンに固定
# - 権限はワークフロー全体で空にし、ジョブ単位で最小付与
# - 依存コードを実行する build ジョブと OIDC トークンを持つ publish ジョブを分離。
#   publish ジョブでは checkout も依存インストールも行わず、検証済み tarball の公開のみ行う
#   (npm publish <tarball> はライフサイクルスクリプトを実行しないことを確認済み)
# - リリース経路ではキャッシュを使わない(キャッシュ経由の改ざん混入を排除)
#
# このファイルの外で必須となる設定(YAML では強制できないため、無いと防御が働かない):
# - GitHub environment「npm-publish」を required reviewers +「Prevent self-reviews」付きで
#   事前作成する。未作成のままタグを push すると保護なしで自動作成され、承認ゲートは存在しない
# - リポジトリ ruleset で v* タグの作成を制限する。Actions は「タグが指すコミット時点の
#   この YAML」を実行するため、タグを作れる者は改ざん版ワークフローごと実行できる
# - npmjs.com の Trusted Publisher にファイル名 publish.yml と environment 名 npm-publish を
#   完全一致(大文字小文字含む)で登録する
# - 初回公開は Trusted Publishing では行えない(未登録パッケージには設定不可)。初回のみ
#   ローカルで 2FA 対話認証の npm publish を行い、公開後に Publishing access を
#   「Require two-factor authentication and disallow tokens」へ変更する(OIDC は影響を受けない)
name: publish

on:
  push:
    tags:
      - "v*"

# 既定では何の権限も与えない。必要な権限は各ジョブで最小付与する
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN の git 資格情報を後続ステップに残さない
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          # メジャー指定 (11) だと実行時に最新 11.x を取得してしまうため正確に固定する
          version: 11.5.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: タグと package.json のバージョン一致を検証
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "タグ v${tag} と package.json のバージョン ${pkg} が一致しません" >&2
            exit 1
          fi

      - name: Lint / 型チェック
        run: |
          pnpm lint
          pnpm typecheck

      - name: テスト
        run: |
          pnpm test
          pnpm --filter @almondoo/klaus-ui test

      - name: フルビルド
        run: pnpm build:all

      - name: tarball を作成
        run: npm pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: "almondoo-klaus-*.tgz"
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # required reviewers +「Prevent self-reviews」を設定した environment に紐付けることで、
    # publish 直前に手動承認ゲートを挟む(冒頭コメントの事前作成が前提)
    environment: npm-publish
    permissions:
      # OIDC トークン発行に必須(Trusted Publishing)
      id-token: write
      # 同一 run の artifact 取得は ACTIONS_RUNTIME_TOKEN で行われるため厳密には不要だが、
      # 参照実装に合わせて read のみ付与(昇格権限ではなく無害)
      actions: read
    steps:
      # このジョブでは checkout も依存インストールも行わず、
      # サードパーティのコードが OIDC トークンと同居しないようにする
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 の同梱 npm (>= 11.5.1) が Trusted Publishing の最低要件を満たす。
          # registry-url は指定しない: 指定すると NODE_AUTH_TOKEN のプレースホルダが
          # .npmrc に書き込まれ OIDC 認証と競合し得る(actions/setup-node#1440, #1551)
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package

      # provenance は Trusted Publishing 経由なら自動付与されるためフラグ不要。
      # pnpm publish は OIDC 未対応のため npm publish を使う
      - name: npm へ公開
        run: |
          # build ジョブでタグ == version を検証済みのため、期待する tarball 名を厳密に指定する
          tarball="almondoo-klaus-${GITHUB_REF_NAME#v}.tgz"
          if [ ! -f "$tarball" ]; then
            echo "${tarball} が見つかりません" >&2
            exit 1
          fi
          npm publish "$tarball" --access public
