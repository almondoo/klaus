name: 認証フロー
env: local          # examples/environments/local.yaml を参照(--env で上書き可)
steps:
  - name: login
    request:
      method: POST
      url: "{{baseUrl}}/login"              # 環境ファイルの baseUrl を埋め込み
      headers:
        Content-Type: application/json
      body:
        email: "{{testEmail}}"              # 環境ファイルの値を埋め込み
        # シークレットは環境ファイルに直書きせず OS 環境変数を参照する:
        #   password: "{{env.TEST_PASSWORD}}"
    capture:
      token: "$.token"                       # レスポンスの JSONPath をキャプチャ
    assert:
      status: 200
      body:
        - path: "$.token"
          exists: true

  - name: get-me
    request:
      method: GET
      url: "{{baseUrl}}/me"
      headers:
        Authorization: "Bearer {{token}}"    # 前ステップのキャプチャを埋め込み
    assert:
      status: 200
      body:
        - path: "$.email"
          equals: "{{testEmail}}"            # アサーションの期待値にも埋め込める
