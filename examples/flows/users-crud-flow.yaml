# yaml-language-server: $schema=https://almondoo.github.io/klaus/schema/flow.schema.json
name: ユーザー CRUD フロー
env: local          # examples/environments/local.yaml を参照(--env で上書き可)
steps:
  - name: create-user
    request:
      method: POST
      url: "{{baseUrl}}/users"
      headers:
        Content-Type: application/json
      body:
        name: Dave
        email: dave@example.com
    capture:
      userId: "$.id"                         # 作成されたユーザーの id を後続ステップへ引き継ぐ
    assert:
      status: 201

  - name: get-user
    request:
      method: GET
      url: "{{baseUrl}}/users/{{userId}}"    # 前ステップのキャプチャを埋め込み
    assert:
      status: 200
      body:
        - path: "$.email"
          equals: dave@example.com

  - name: delete-user
    request:
      method: DELETE
      url: "{{baseUrl}}/users/{{userId}}"
    assert:
      status: 204
