# yaml-language-server: $schema=https://almondoo.github.io/klaus/schema/flow.schema.json
name: ユーザー一覧 API 単体チェック
# query / headers / body(JSONPath)/ bodySchema の一通りのアサーションの書き方をまとめた見本。
env: local          # examples/environments/local.yaml を参照(--env で上書き可)
steps:
  - name: list-users
    request:
      method: GET
      url: "{{baseUrl}}/users"
      query:
        limit: "2"        # query の値は文字列で指定する(URL のクエリ文字列にマージされる)
    assert:
      status: 200
      headers:
        - name: Content-Type
          contains: application/json
      body:
        - path: "$.users[0].email"
          exists: true
        - path: "$.users[0].email"
          contains: "@example.com"
      bodySchema:
        type: object
        required: [users]
        properties:
          users:
            type: array
            maxItems: 2
            items:
              type: object
              required: [id, name, email]
              properties:
                id:
                  type: string
                name:
                  type: string
                email:
                  type: string
